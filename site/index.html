<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私のサイト</title>
  <style>
    body { font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.7; color: #222; }
    label { display: block; margin: 0.8rem 0; }
    input, textarea { width: 100%; padding: 0.5rem; font: inherit; box-sizing: border-box; }
    button { padding: 0.5rem 1.5rem; font: inherit; }
  </style>
</head>
<body>
  <h1>私のサイト</h1>
  <p>このページは <code>site/index.html</code> です。自由に書き換えて、main ブランチへ push すると公開されます。</p>

  <h2>お問い合わせ</h2>
  <!--
    送信先 URL の "my-site" は、portal で作成したサイトのプレフィックスに置き換えてください。
    (例: https://portal.com-intro.com/api/forms/<プレフィックス>/contact)
    メールは、portal のサイト詳細「フォーム」に登録した Resend 経由で届きます。
    _next(送信後に自分のページへ移動する指定)は必要なときだけ追加してください。
  -->
  <form method="post" action="https://portal.com-intro.com/api/forms/my-site/contact">
    <label>お名前 <input name="name" required></label>
    <label>メール <input name="email" type="email" required></label>
    <label>内容 <textarea name="message" rows="5" required></textarea></label>
    <input name="_hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <button type="submit">送信</button>
  </form>
</body>
</html>
